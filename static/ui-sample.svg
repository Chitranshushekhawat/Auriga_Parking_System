<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Auriga Parking interface sample</title>
  <desc id="desc">A visual sample of the Auriga parking landing page and attendant dashboard.</desc>
  <rect width="1200" height="760" fill="#f5f7f1"/>
  <rect x="0" y="0" width="1200" height="48" fill="#f7f8f3" stroke="#dfe6df"/>
  <rect x="42" y="14" width="22" height="22" fill="#172221"/>
  <text x="49" y="30" font-family="monospace" font-size="12" fill="#bbf3d8">A</text>
  <text x="75" y="29" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#172221">AURIGA.</text>
  <text x="1030" y="28" font-family="monospace" font-size="9" fill="#71807c">WHY AURIGA</text>
  <text x="1105" y="28" font-family="monospace" font-size="9" fill="#71807c">SIGN IN</text>

  <text x="84" y="105" font-family="monospace" font-size="10" letter-spacing="2" fill="#25835e">CITY-CENTRE PARKING CONTROL</text>
  <text x="84" y="155" font-family="sans-serif" font-size="46" font-weight="700" fill="#172221">Every car</text>
  <text x="84" y="202" font-family="sans-serif" font-size="46" font-weight="700" fill="#172221">accounted for.</text>
  <text x="84" y="249" font-family="sans-serif" font-size="46" font-weight="700" fill="#25835e">Every charge</text>
  <text x="84" y="296" font-family="sans-serif" font-size="46" font-weight="700" fill="#25835e">right.</text>
  <text x="84" y="335" font-family="sans-serif" font-size="15" fill="#71807c">A calm command centre for busy garages.</text>
  <text x="84" y="357" font-family="sans-serif" font-size="15" fill="#71807c">Check cars in, find the right spot, and keep the shift moving.</text>
  <rect x="84" y="388" width="170" height="36" fill="#172221"/>
  <text x="101" y="411" font-family="monospace" font-size="10" fill="#bbf3d8">OPEN DASHBOARD  &gt;</text>
  <rect x="268" y="388" width="150" height="36" fill="none" stroke="#dfe6df"/>
  <text x="285" y="411" font-family="monospace" font-size="10" fill="#172221">SEE FEATURES</text>

  <rect x="745" y="120" width="350" height="225" fill="#172221" transform="rotate(2 920 230)"/>
  <text x="775" y="151" font-family="monospace" font-size="9" fill="#bbf3d8">LIVE FLOOR PLAN</text>
  <circle cx="1040" cy="148" r="4" fill="#bbf3d8"/>
  <text x="1052" y="151" font-family="monospace" font-size="9" fill="#bbf3d8">LIVE</text>
  <text x="775" y="188" font-family="monospace" font-size="9" fill="#bbf3d8">L2</text>
  <text x="775" y="235" font-family="monospace" font-size="9" fill="#bbf3d8">L1</text>
  <text x="775" y="282" font-family="monospace" font-size="9" fill="#bbf3d8">EV</text>
  <g fill="none" stroke="#71807c">
    <rect x="820" y="169" width="52" height="30"/><rect x="880" y="169" width="52" height="30"/><rect x="940" y="169" width="52" height="30"/><rect x="1000" y="169" width="52" height="30"/>
    <rect x="820" y="216" width="52" height="30"/><rect x="880" y="216" width="52" height="30"/><rect x="940" y="216" width="52" height="30"/><rect x="1000" y="216" width="52" height="30"/>
    <rect x="820" y="263" width="70" height="30"/><rect x="900" y="263" width="70" height="30"/><rect x="980" y="263" width="70" height="30"/>
  </g>
  <rect x="940" y="169" width="52" height="30" fill="#fa704d"/><rect x="880" y="216" width="52" height="30" fill="#fa704d"/><rect x="820" y="263" width="70" height="30" fill="#fa704d"/>
  <text x="832" y="188" font-family="monospace" font-size="9" fill="#bbf3d8">01</text><text x="892" y="188" font-family="monospace" font-size="9" fill="#bbf3d8">02</text><text x="952" y="188" font-family="monospace" font-size="9" fill="#172221">03</text>
  <text x="832" y="235" font-family="monospace" font-size="9" fill="#bbf3d8">01</text><text x="892" y="235" font-family="monospace" font-size="9" fill="#172221">02</text><text x="832" y="282" font-family="monospace" font-size="9" fill="#172221">01</text>

  <rect x="0" y="460" width="1200" height="300" fill="#edf3ec"/>
  <text x="84" y="505" font-family="monospace" font-size="10" letter-spacing="2" fill="#25835e">AURIGA CENTRAL GARAGE</text>
  <text x="84" y="548" font-family="sans-serif" font-size="32" font-weight="700" fill="#172221">Good shift,</text>
  <text x="280" y="548" font-family="sans-serif" font-size="32" font-weight="700" fill="#25835e">Chitranshu.</text>
  <g fill="#ffffff" stroke="#dfe6df">
    <rect x="84" y="580" width="190" height="100"/><rect x="288" y="580" width="190" height="100"/><rect x="492" y="580" width="190" height="100"/><rect x="696" y="580" width="190" height="100"/>
  </g>
  <g font-family="monospace" fill="#71807c">
    <text x="101" y="605" font-size="9">LIVE VEHICLES</text><text x="101" y="640" font-size="24" fill="#172221">6</text><text x="101" y="661" font-size="9">currently inside</text>
    <text x="305" y="605" font-size="9">COMPACT</text><text x="305" y="640" font-size="24" fill="#172221">6 / 6</text><text x="305" y="661" font-size="9">spots available</text>
    <text x="509" y="605" font-size="9">STANDARD</text><text x="509" y="640" font-size="24" fill="#172221">12 / 12</text><text x="509" y="661" font-size="9">spots available</text>
    <text x="713" y="605" font-size="9">EV CHARGER</text><text x="713" y="640" font-size="24" fill="#172221">4 / 4</text><text x="713" y="661" font-size="9">spots available</text>
  </g>
  <text x="925" y="610" font-family="monospace" font-size="10" fill="#25835e">PARKING LOG</text>
  <line x1="925" y1="628" x2="1130" y2="628" stroke="#dfe6df"/>
  <text x="925" y="650" font-family="monospace" font-size="9" fill="#172221">PLATE / DRIVER</text>
  <text x="925" y="670" font-family="sans-serif" font-size="12" fill="#172221">AU23 42</text>
  <text x="1020" y="670" font-family="sans-serif" font-size="12" fill="#25835e">EV-01</text>
</svg>
